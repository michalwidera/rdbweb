# RetractorDB — Jekyll config for the custom brand site (see BRAND.md).
# This site no longer uses a remote theme (Minimal Mistakes) — chrome
# lives in _layouts/default.html + assets/css/site.css, and the
# homepage (index.html) is a self-contained static file per BRAND.md
# section 6 ("deploy as-is").

title: RetractorDB
email: michal@widera.com.pl
description: >-
  RetractorDB is an open-source stream database engine whose resampling
  operators are proved exact — grounded in rational Beatty sequences and
  Fraenkel's partition theorem.
twitter_username: widera_michal
github_username: michalwidera
logo: "/assets/favicon-180.png"

url: "https://retractordb.com"

markdown: kramdown
permalink: /:categories/:title/
timezone: Europe/Warsaw

include:
  - _pages

# index.html and 404.md are served from repo root / _pages respectively;
# _pages is included above so Jekyll processes front-matter pages that
# live outside the default posts/collections folders.

plugins:
  - jekyll-sitemap
  - jekyll-feed

defaults:
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: default
