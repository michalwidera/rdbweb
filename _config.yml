# RetractorDB — Jekyll config for the custom brand site.
# This site no longer uses a remote theme (Minimal Mistakes) — chrome
# lives in _layouts/default.html (inner pages) and _layouts/home.html
# (homepage, rendered from index.md), sharing nav/footer/head partials
# from _includes and tokens/rules from assets/css/site.css.

title: RetractorDB
email: michal@widera.com.pl
description: >-
  RetractorDB is an open-source stream database engine whose resampling
  operators are proved exact — grounded in rational Beatty sequences and
  Fraenkel's partition theorem.
twitter_username: widera_michal
github_username: michalwidera
logo: "/assets/favicon-180.png"

url: "https://retractordb.com"

markdown: kramdown
permalink: /:categories/:title/
timezone: Europe/Warsaw

include:
  - _pages

# _pages holds every front-matter page, including index.md (permalink: /)
# and 404.md; it's included above so Jekyll processes pages that live
# outside the default posts/collections folders.

plugins:
  - jekyll-sitemap
  - jekyll-feed

defaults:
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: default
