  home_qrs_cm: ["# 1. filtr pasmowoprzepustowy 5–15 Hz — splot FIR, 25 odczepów", "# 2. różniczkowanie — FIR, 5 odczepów", "# 3. kwadrat", "# 4. całkowanie w oknie ruchomym — 30 próbek", "# 5. próg adaptacyjny — średnia ruchoma 180 próbek (0,5 s)", "# wyjście: EKG wycentrowane, obwiednia ×5, detekcja ×5"]
  home_qrs_top: "qrs_out[0] = MLII − 900"
