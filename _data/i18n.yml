  home_tab_plan: "Plan DAG"
  home_tab_tuples: "Krotki"
  home_tab_output: "Wynik qrs_out"
  home_simple_note: >-
    Każda kolumna to jeden rekord n strumienia str1 (&Delta; = 1/10). Krotka
    core1 trwa dwa sloty, więc łączy się z dwiema kolejnymi krotkami core0.
    Przy n = 8 plik datafile2.dat (8 rekordów) zaczyna się od pierwszej wartości.
  home_simple_max_note: >-
    str0 łączy oba źródła dokładnie jak w simple; str1 = str0.max zachowuje
    większe pole każdej krotki str0; str2 = str0 + str1 niesie oba obok siebie.
  home_lang_showcase_note: >-
    core@(1,2) przesuwa okno dwóch wartości po ciągu a, b, a, b… (krok 1),
    więc win ma &Delta; = 1/20, a core[_] rozwija się w oba sloty okna.
    peak = MAX(win) zachowuje większą z nich. gap[2] to generator strumieni:
    $ = 0 i 1 dają gap$0 = peak &minus; a oraz gap$1 = peak &minus; b.
  home_legend_decl: "Declaration — źródło (DECLARE)"
  home_legend_query: "zapytanie (SELECT … STREAM)"
  home_legend_prog: "program operatorów zapytania"
  home_legend_field: "program pola"
