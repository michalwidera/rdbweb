  home_simple_note: >-
    Each column is one record n of str1 (&Delta; = 1/10). A core1 tuple lasts
    two slots, so it pairs with two consecutive core0 tuples. At n = 8 the
    8-record datafile2.dat starts again from its first value.
  home_simple_max_note: >-
    str0 pairs the two sources exactly as in simple; str1 = str0.max keeps the
    larger field of each str0 tuple; str2 = str0 + str1 carries both side by side.
  home_lang_showcase_note: >-
    core@(1,2) slides a two-value window over the sequence a, b, a, b… (step 1),
    so win ticks at &Delta; = 1/20 and core[_] expands into both window slots.
    peak = MAX(win) keeps the larger one. gap[2] is a stream generator: $ = 0 and 1
    yield gap$0 = peak &minus; a and gap$1 = peak &minus; b.
