<!DOCTYPE html>
<html lang="{{ page.lang | default: 'en' }}" data-alt-url="{{ page.lang_alt | default: '/' }}">
<head>
{% include head.html %}
</head>
<body>

{% include nav.html %}

<div class="pageheader">
  <div class="pageheader-in">
    {% if page.eyebrow %}<span class="eyebrow">{{ page.eyebrow }}</span>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.excerpt %}<p class="lede">{{ page.excerpt }}</p>{% endif %}
  </div>
</div>

<main>
  <div class="wrap">
    {{ content }}
  </div>
</main>

{% include footer.html %}

</body>
</html>
