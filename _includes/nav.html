{% assign lang = page.lang | default: "en" %}
{% assign t = site.data.i18n[lang] %}
<header class="site-header">
  <nav class="nav-in" aria-label="{{ t.nav_label }}">
    <a class="brand" href="{{ t.home_url }}" aria-label="RetractorDB home">
      <span class="mark-wrap" aria-hidden="true">
        <img class="mark mark-dark" src="/assets/images/icon/scissors-dark.svg" alt="" width="30" height="30">
        <img class="mark mark-light" src="/assets/images/icon/scissors.svg" alt="" width="30" height="30">
      </span>
      <span class="wordmark">Retractor<b>DB</b></span>
    </a>
    <div class="nav-links">
      <a href="https://arxiv.org/abs/2607.07730">{{ t.nav_paper }}</a>
      <a href="{{ t.docs_url }}">{{ t.nav_docs }}</a>
      <a href="{{ t.trademark_url }}">{{ t.nav_trademark }}</a>
    </div>
    <div class="nav-actions">
      <button class="icon-btn theme-toggle" type="button" aria-label="{{ t.theme_toggle_label }}" onclick="toggleTheme()">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.4 15.4A8.6 8.6 0 1 1 8.6 3.6a6.8 6.8 0 0 0 11.8 11.8z"/></svg>
      </button>
      <a class="icon-btn lang-toggle" href="{{ page.lang_alt | default: '/' }}" aria-label="{{ t.lang_toggle_label }}" onclick="try{localStorage.setItem('lang','{{ t.lang_toggle_short | downcase }}')}catch(e){}">{{ t.lang_toggle_short }}</a>
      <a class="icon-btn" href="https://github.com/michalwidera/retractordb" aria-label="{{ t.nav_github }}">{% include icons/github.svg %}</a>
    </div>
  </nav>
</header>
